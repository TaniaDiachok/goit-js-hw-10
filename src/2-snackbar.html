<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snackbar</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <a class="back-link" href="./index.html">Go back</a>
        <h1 class="main-title">Snackbar</h1>
          <div class="snackbar">
          <form class="form">
            <label class="delay-label">
              Delay (ms)
              <input type="number" class="delay-input" name="delay" required />
            </label>
  
            <fieldset class="state-group">
              <legend class="legend">State</legend>
              <div class="label-group">
                <label class="state-label">
                  <input type="radio" class="state-input" name="state" value="fulfilled" required />
                  Fulfilled
                </label>
                <label class="state-label">
                  <input type="radio" class="state-input" name="state" value="rejected" required />
                  Rejected
                </label>
              </div>
            </fieldset>
  
              <button type="submit" class="btn">Create notification</button>
          </form>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./js/2-snackbar.js"></script>
  </body>
</html>
